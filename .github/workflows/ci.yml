name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build
        env:
          # Only fail-closed checks need these to be non-empty; the actual
          # values are never used against a real provider in CI.
          STRIPE_WEBHOOK_SECRET: whsec_ci_dummy
          GITHUB_WEBHOOK_SECRET: ghsec_ci_dummy

      - run: pnpm lint

      - run: pnpm test
        # No DATABASE_URL/TEST_DATABASE_URL needed - @relayos/postgres's
        # integration tests provision their own Postgres via testcontainers,
        # using the Docker already available on GitHub-hosted runners.
