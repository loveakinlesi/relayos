name: Release

# Publishes via semantic-release, driven by Conventional Commits on main.
# Every push to main is analyzed; if the new commits warrant a release
# (feat/fix/BREAKING CHANGE), semantic-release computes the next version,
# writes it to every package in scripts/release/packages.mjs, builds,
# publishes each to npm, tags, and cuts a GitHub release. Otherwise it's a
# no-op. This workflow is intentionally inert until an NPM_TOKEN secret
# (npm automation token, bypasses 2FA prompts) is configured on the repo.

on:
  push:
    branches:
      - main
  workflow_dispatch: # manual retry - always runs fresh against current main,
    # unlike re-running a past run, which checks out that run's original
    # (possibly now-stale) commit and gets rejected by semantic-release's
    # own stale-branch guard

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  id-token: write # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # semantic-release needs full history/tags

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # actions/setup-node's registry-url writes a ~/.npmrc that reads
          # the token from NODE_AUTH_TOKEN specifically - NPM_TOKEN (the
          # name changesets/action expected) is a no-op here and silently
          # sends an unauthenticated request instead.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
          # @semantic-release/git's automated release commit isn't a human
          # writing a conventional-commit message - it's a generated
          # changelog dump that will legitimately violate commitlint rules
          # (e.g. a commit link pushes a line over 100 chars). HUSKY=0 is
          # husky's own documented escape hatch (checked inside its
          # .husky/_/h wrapper) - the commit-msg hook still applies to
          # every human commit, just not this generated one.
          HUSKY: 0
