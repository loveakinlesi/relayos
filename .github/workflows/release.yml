name: Release

# Publishes via semantic-release, driven by Conventional Commits on main.
# Every push to main is analyzed; if the new commits warrant a release
# (feat/fix/BREAKING CHANGE), semantic-release computes the next version,
# writes it to every package in scripts/release/packages.mjs, builds,
# publishes each to npm, tags, and cuts a GitHub release. Otherwise it's a
# no-op. This workflow is intentionally inert until an NPM_TOKEN secret
# (npm automation token, bypasses 2FA prompts) is configured on the repo.

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  id-token: write # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # semantic-release needs full history/tags

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
