name: Deploy docs to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'apps/docs/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/configure-pages@v6

      - run: pnpm install --frozen-lockfile

      # GITHUB_PAGES=true switches next.config.mjs into static export mode
      # (output: 'export', basePath: '/restaq') - regular `pnpm build`
      # elsewhere (dev, CI, Vercel-style hosting) is unaffected.
      - name: Build docs (static export)
        working-directory: apps/docs
        run: pnpm build
        env:
          GITHUB_PAGES: 'true'

      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/docs/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
