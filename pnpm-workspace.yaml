packages:
  - 'packages/*'
  - 'apps/*'
  - 'e2e'

allowBuilds:
  better-sqlite3: true
  cpu-features: true
  esbuild: true
  protobufjs: true
  sharp: true
  ssh2: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - vite@8.1.5

overrides:
  esbuild: '>=0.28.1'
  vite: '8.1.5'
  postcss: '>=8.5.10'
  brace-expansion@5.0.6: '5.0.7'
